<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="../styles/login.css">
    <script type="module" src="../services/login.service.js"></script>
    <meta name="description" content="Log in to your account to manage your appointments, discover available services, and stay connected with your organization.">
    <meta property="og:title" content="Login | Smart Appointment Booking">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://amjad-adi-domain/login">
    <meta property="og:image" content="https://amjad-adi-domain/images/appointment-booking-preview.png">
    <meta property="og:image:alt" content="Smart Appointment Booking login page">

    <link rel="icon" href="../images/icons/icon.png" sizes="any">
    <link rel="apple-touch-icon" href="../images/icons/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#fafafa">
</head>
<body>
<main>
    <form class="login-form">
        <img src="../images/icons/icon.png" alt="Smart Appointment Booking icon" class="icon">
        <p class="login-title">Appointment Booking System</p>
        <p class="login-description">Sign in to manage your appointments and organizations</p>
        <input type="email" name="email" id="email" placeholder="Email">
        <input type="password" name="password" id="password" placeholder="Password">
        <div class="login-options">
            <section class="remember-me">
                <input type="checkbox" name="remember" id="remember">
                <label for="remember">Remember me</label>
            </section>
                <a href="forgot-password.html">Forgot Password?</a>
        </div>
        <button type="submit" id="login-button">Sign In</button>
        <section class="divider"><span>Or</span></section>
        <a class="social-media" href="https://google.com">
            <img src="../images/login-images/google-logo.svg" alt="google icon">
            <p>Continue With Google</p>
        </a>
        <section class="sign-up">
            <p>Don't have an account?</p>
            <a href="signup.html">Create Account</a>
        </section>
    </form>
</main>
</body>
</html>
